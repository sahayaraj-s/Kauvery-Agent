<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kauvery Agent – Premium Desktop Overlay</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/kauvery-logo.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(22, 5, 23, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #d80064, #f85a28);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #f52f89, #ffb81c);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
